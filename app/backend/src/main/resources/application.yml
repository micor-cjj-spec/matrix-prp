server:
  port: 8080

spring:
  application:
    name: matrix-prp-backend
  datasource:
    url: ${MATRIX_PRP_DB_URL:jdbc:mysql://localhost:3306/matrix_prp?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MATRIX_PRP_DB_USER:matrix_prp}
    password: ${MATRIX_PRP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

matrix-prp:
  knowledge:
    root: ../../knowledge
  video:
    storage-root: ${MATRIX_PRP_VIDEO_ROOT:./data/videos}
  bootstrap:
    username: ${MATRIX_PRP_BOOTSTRAP_USERNAME:}
    password: ${MATRIX_PRP_BOOTSTRAP_PASSWORD:}
  security:
    jwt-secret: ${MATRIX_PRP_JWT_SECRET}
    jwt-expiration-minutes: 1440

