server:
  port: 8080

spring:
  ai:
    mcp:
      server:
        enabled: ${MATRIX_PRP_MCP_ENABLED:false}
        protocol: STATELESS
        type: SYNC
        name: matrix-prp
        version: 1.0.0
        tool-callback-converter: false
        annotation-scanner:
          enabled: false
        stateless:
          mcp-endpoint: /api/mcp
        # Spring AI 1.1.8 WebMVC transport currently reads the Streamable-HTTP
        # endpoint property when installing its stateless RouterFunction.
        streamable-http:
          mcp-endpoint: /api/mcp
  application:
    name: matrix-prp-backend
  servlet:
    multipart:
      max-file-size: 13MB
      max-request-size: 14MB
  datasource:
    url: ${MATRIX_PRP_DB_URL:jdbc:mysql://localhost:3306/matrix_prp?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MATRIX_PRP_DB_USER:matrix_prp}
    password: ${MATRIX_PRP_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000

  # Transition release: do not silently baseline an existing production database.
  flyway:
    enabled: ${MATRIX_PRP_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

matrix-prp:
  mcp:
    enabled: ${MATRIX_PRP_MCP_ENABLED:false}
    write-enabled: ${MATRIX_PRP_MCP_WRITE_ENABLED:false}
    # Optional first production task-only canary safety lock; does NOT approve deployment.
    # Requires exact PRP owner database, OAuth, task-only scopes, writes OFF and Flyway OFF.
    production-tasks-only: ${MATRIX_PRP_MCP_PRODUCTION_TASKS_ONLY:false}
    # Exact HTTPS browser origins; never use wildcard or suffix matching.
    allowed-origins: ${MATRIX_PRP_MCP_ALLOWED_ORIGINS:https://micor.top}
    # Resource-server mode: external OAuth issuer/JWKS. No PRP JWT fallback for /api/mcp.
    # All three HTTPS URLs must be configured before oauth.enabled=true.
    oauth:
      enabled: ${MATRIX_PRP_MCP_OAUTH_ENABLED:false}
      issuer: ${MATRIX_PRP_MCP_OAUTH_ISSUER:}
      jwk-set-uri: ${MATRIX_PRP_MCP_OAUTH_JWK_SET_URI:}
      resource: ${MATRIX_PRP_MCP_OAUTH_RESOURCE:}
      # Discovery drives client permission requests. Extra data/write scopes require explicit opt-in.
      advertised-scopes: ${MATRIX_PRP_MCP_OAUTH_ADVERTISED_SCOPES:prp.tasks.read}
  knowledge:
    root: ../../knowledge
  vocal:
    storage-root: ${MATRIX_PRP_VOCAL_ROOT:./data/vocal}
  video:
    storage-root: ${MATRIX_PRP_VIDEO_ROOT:./data/videos}
    delivery: ${MATRIX_PRP_VIDEO_DELIVERY:java}
  bootstrap:
    username: ${MATRIX_PRP_BOOTSTRAP_USERNAME:}
    password: ${MATRIX_PRP_BOOTSTRAP_PASSWORD:}
  security:
    jwt-secret: ${MATRIX_PRP_JWT_SECRET}
    jwt-expiration-minutes: 1440

  ai:
    # Spring AI handles all configured chat providers by default.
    # Emergency rollback: MATRIX_PRP_AI_SPRING_AI_ENABLED=false restores native HTTP.
    # Positive canary-user-id is an optional narrowing override (0 = all users).
    spring-ai:
      enabled: ${MATRIX_PRP_AI_SPRING_AI_ENABLED:true}
      # Only the model proposes tool calls. Execution requires PRP consent and allowlist.
      tools-enabled: ${MATRIX_PRP_AI_SPRING_AI_TOOLS_ENABLED:true}
      # Text-only practice generation and wellness draft/change parsing.
      # Image/vision remains native until its multimodal adapter is validated.
      structured-enabled: ${MATRIX_PRP_AI_SPRING_AI_STRUCTURED_ENABLED:true}
      # Opt-in until real provider and mobile image acceptance tests are recorded.
      vision-enabled: ${MATRIX_PRP_AI_SPRING_AI_VISION_ENABLED:false}
      canary-user-id: ${MATRIX_PRP_AI_SPRING_AI_CANARY_USER_ID:0}
    # P4: privileged actions token is server-only. Codex executes exclusively in ephemeral GitHub Actions.
    codex:
      enabled: ${MATRIX_PRP_CODEX_ENABLED:false}
      github-token: ${MATRIX_PRP_CODEX_GITHUB_TOKEN:}
      repository: ${MATRIX_PRP_CODEX_REPOSITORY:micor-cjj-spec/matrix-prp}
    # P2 OpenClaw requires a dedicated isolated instance; shared Gateway token carries operator privileges.
    openclaw:
      enabled: ${MATRIX_PRP_OPENCLAW_ENABLED:false}
      isolation-confirmed: ${MATRIX_PRP_OPENCLAW_ISOLATION_CONFIRMED:false}
      gateway-token: ${MATRIX_PRP_OPENCLAW_GATEWAY_TOKEN:}
      port: ${MATRIX_PRP_OPENCLAW_PORT:18789}
      agent-id: ${MATRIX_PRP_OPENCLAW_AGENT_ID:prp-planner}
    # Required before storing individual API keys: base64-encoded 32 random bytes.
    key-encryption-secret: ${MATRIX_PRP_AI_KEY_ENCRYPTION_SECRET:}
    deepseek:
      api-key: ${MATRIX_PRP_DEEPSEEK_API_KEY:}
      model: ${MATRIX_PRP_DEEPSEEK_MODEL:deepseek-chat}
    max-output-tokens: 1024
    # The two dimensions are independent: a request consumes both 1 call and
    # estimated token reservation. Keep token budgets sufficient for 2,000
    # typical chat calls. Provider billing / rate limits still apply.
    # Production can override these values with the named environment variables.
    user-monthly-requests: ${MATRIX_PRP_AI_USER_MONTHLY_REQUESTS:2000}
    global-monthly-requests: ${MATRIX_PRP_AI_GLOBAL_MONTHLY_REQUESTS:10000}
    user-monthly-reserved-tokens: ${MATRIX_PRP_AI_USER_MONTHLY_TOKENS:12000000}
    global-monthly-reserved-tokens: ${MATRIX_PRP_AI_GLOBAL_MONTHLY_TOKENS:60000000}

  wellness:
    # Optional USDA FoodData Central (CC0) server-only key; never exposed to browsers.
    usda-api-key: ${MATRIX_PRP_USDA_API_KEY:}
