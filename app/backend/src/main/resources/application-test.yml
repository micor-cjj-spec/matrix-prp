spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

matrix-prp:
  security:
    login-rate-limit-enabled: false
    jwt-secret: test-only-jwt-key-do-not-use-in-prod-012345678901
  ai:
    # Existing controller tests mock native provider HTTP; the dedicated
    # Spring AI adapter and gateway integration tests explicitly enable it.
    spring-ai:
      enabled: false
      tools-enabled: false
      structured-enabled: false
