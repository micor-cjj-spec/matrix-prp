services:
  mysql:
    image: mysql:8.4
    container_name: matrix-prp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MATRIX_PRP_MYSQL_ROOT_PASSWORD:?Set a strong MySQL root password}
      MYSQL_DATABASE: matrix_prp
      MYSQL_USER: matrix_prp
      MYSQL_PASSWORD: ${MATRIX_PRP_DB_PASSWORD:?Set a strong DB password}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - matrix_prp_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  matrix_prp_mysql_data:
