# Reference-only standalone OAuth issuer. Do not attach to PRP production release.
# No public port or secrets in source control. A reviewed TLS reverse proxy is mandatory.
services:
  auth-db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${MCP_AUTH_DB_PASSWORD:?MCP_AUTH_DB_PASSWORD is required}
    volumes:
      - mcp_auth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [auth-backend]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://auth-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${MCP_AUTH_DB_PASSWORD:?MCP_AUTH_DB_PASSWORD is required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${MCP_AUTH_ADMIN_USERNAME:?MCP_AUTH_ADMIN_USERNAME is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${MCP_AUTH_ADMIN_PASSWORD:?MCP_AUTH_ADMIN_PASSWORD is required}
      KC_HOSTNAME: ${MCP_AUTH_PUBLIC_URL:?MCP_AUTH_PUBLIC_URL (https://...) is required}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_FEATURES: "cimd,resource-indicators"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
    depends_on:
      auth-db:
        condition: service_healthy
    networks: [auth-backend]
    mem_limit: 2g

networks:
  auth-backend:
    driver: bridge
volumes:
  mcp_auth_pgdata:
