name: PRP ChatGPT CIMD contract (offline)
on:
  push:
    branches: [fix/mcp-cimd-readonly-audit-20261024, test/mcp-authcode-privatejwt-refresh-20261024]
  pull_request:
    branches: [feat/mcp-public-acceptance-20261024]
permissions:
  contents: read
jobs:
  mcp-scope-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Test actual metadata endpoint and OAuth permission boundaries
        working-directory: app/backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=McpFirstPartyOwnerMappingTests,McpFirstPartyOidcLinkTests,McpOAuthSecurityTests,McpOAuthTaskIsolationTests,McpOAuthAdvertisedScopesTests,McpOAuthCanonicalResourceTests,McpOAuthJwtValidationTests,McpOAuthClientIdentityTests,McpActivationGuardTests test
  cimd-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test metadata method negotiation and fail-closed discovery
        working-directory: app/deploy/mcp-oauth
        run: python3 -m unittest discover -p 'test_*.py'
      - name: Verify stage PKCE configuration remains OFF and exactly pinned
        working-directory: app/deploy/mcp-staging
        run: python3 -m unittest -v test_staging_config.py test_approval_routes_pending.py test_readonly_link_routes_pending.py test_render_tls.py
      - name: Render staging Compose privately without launching services
        working-directory: app/deploy/mcp-staging
        run: |
          secure_dir="$(mktemp -d)"
          trap 'rm -rf "$secure_dir"' EXIT
          python3 prepare_env.py --output "$secure_dir/.env" >/dev/null
          python3 check_rendered_compose.py --env-file "$secure_dir/.env"

  # Compile the opt-in first-party OIDC linking UI. No public deployment.
  first-party-link-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Verify Vue callback and grant-page types
        working-directory: app/web
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          node --experimental-strip-types --test scripts/oidc-callback-path.test.mjs scripts/mcp-oidc-authorize-url.test.mjs

  # External read-only evidence; never substitutes for a real OAuth login,
  # managed client policy, isolated restore, or release approval.
  cimd-live-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate public ChatGPT CIMD document and issuer metadata (no tokens)
        working-directory: app/deploy/mcp-oauth
        run: python3 chatgpt_cimd_preflight.py
