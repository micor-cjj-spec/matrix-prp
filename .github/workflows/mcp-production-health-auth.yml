name: PRP production health auth candidate (isolated only)
on:
  workflow_call:
permissions:
  contents: read
jobs:
  isolated-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/deploy/mcp-production-health/auth-policy/pom.xml
      - name: Check fixed health Realm, independent vhost and policy
        run: |
          python3 -m unittest discover -s app/deploy/mcp-production-health -p 'test_contract.py' -v
          mvn -B -ntp -f app/deploy/mcp-production-health/auth-policy/pom.xml verify
      - name: Install disposable runner Nginx only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Real local Keycloak, PostgreSQL, TLS and signed health code/refresh tests
        run: python3 app/deploy/mcp-production-health/ci_auth.py
      - name: Preserve candidate evidence, no credentials or databases
        uses: actions/upload-artifact@v4
        with:
          name: prp-production-health-auth-CANDIDATE
          path: |
            app/deploy/mcp-production-health/auth-candidate-result.safe.json
            app/deploy/mcp-production-health/auth-policy/target/prp-production-health-policy.jar
          if-no-files-found: error
          retention-days: 3
