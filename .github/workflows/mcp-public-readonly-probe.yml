name: MCP public preflight code tests (offline)
on:
  push:
    branches:
      - test/mcp-public-readonly-reachability-20261025
permissions:
  contents: read
jobs:
  no-network-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public read-only probe against static fixtures, no external calls
        run: python3 -m unittest discover -s app/deploy/mcp-oauth -p test_public_readonly_probe.py -v
