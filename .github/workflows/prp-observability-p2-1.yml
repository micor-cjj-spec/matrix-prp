name: PRP observability P2.1 disposable availability
on:
  pull_request:
    paths:
      - 'app/observability/p2-1/**'
      - '.github/workflows/prp-observability-p2-1.yml'
permissions:
  contents: read
jobs:
  isolated-availability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Synthetic HTTP and TLS probes (no real PRP targets)
        run: python3 app/observability/p2-1/ci_availability.py
