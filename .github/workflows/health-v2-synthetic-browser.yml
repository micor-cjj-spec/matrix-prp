name: Health V2 synthetic mobile browsers (CI ONLY)
on:
  push:
    branches: [test/health-v2-synthetic-browser-smoke-20261122-0528]
    paths:
      - app/scripts/health_v2_browser_smoke.py
      - .github/workflows/health-v2-synthetic-browser.yml
  pull_request:
    branches: [test/health-v2-dev-ci-preview-20261122-0520]
    paths:
      - app/scripts/health_v2_browser_smoke.py
      - .github/workflows/health-v2-synthetic-browser.yml

permissions:
  contents: read

jobs:
  health-browser:
    name: Synthetic Health V2 ${{ matrix.browser }} 375/390/1280
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout isolated review branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Use Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser-only dependencies
        run: |
          npm ci --prefix app/web
          python3 -m pip install --no-cache-dir playwright==1.55.0
          python3 -m playwright install --with-deps ${{ matrix.browser }}
      - name: Compile exact reviewed Health V2 Vue source
        env:
          VITE_APP_BASE: /prp/
          VITE_API_BASE: /api
        run: npm run build --prefix app/web
      - name: Browser acceptance using synthetic requests only
        env:
          VITE_APP_BASE: /prp/
          VITE_API_BASE: /api
          PRP_HEALTH_BROWSER: ${{ matrix.browser }}
          PRP_HEALTH_SMOKE_URL: http://127.0.0.1:4173/prp/
          PRP_HEALTH_SMOKE_DIR: ${{ runner.temp }}/health-v2-browser
        shell: bash
        run: |
          set -Eeuo pipefail
          cd app/web
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort \
            > "$RUNNER_TEMP/health-v2-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl --silent --fail --output /dev/null "$PRP_HEALTH_SMOKE_URL"; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          python3 ../scripts/health_v2_browser_smoke.py
      - name: Retain synthetic-only screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: health-v2-synthetic-${{ matrix.browser }}-${{ github.run_id }}
          path: ${{ runner.temp }}/health-v2-browser/
          if-no-files-found: ignore
          retention-days: 3
