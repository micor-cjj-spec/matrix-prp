# PROPOSED CONTROL ONLY: this workflow does NOT become a required check
# unless an administrator explicitly approves and activates it on main.
# Public-repo pull_request_target requires a separately allowed Actions event
# policy starting December 2, 2026; do NOT add as required before verification.
name: PRP main source-branch check (pending owner review)

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  main-pr-source-dev:
    name: main-pr-source-dev
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # This event runs on the trusted base repository. Checkout only the
      # protected main source, NEVER the untrusted pull request/head SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Fail closed unless PR head is dev in this exact repository
        run: python3 app/scripts/dev-collab/main-pr-source-gate.py
