name: V2 meal candidate isolated validation

on:
  push:
    branches:
      - fix/mcp-meal-v2-stage-candidate-20261105

permissions:
  contents: read

jobs:
  backend:
    name: V2 backend compile and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Test exact V2 candidate sources
        working-directory: app/backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test
  web:
    name: V2 approval UI full build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install exact locked dependencies
        working-directory: app/web
        run: npm ci --no-audit --no-fund
      - name: Verify approval UI and build
        working-directory: app/web
        env:
          VITE_APP_BASE: /prp/
        run: npm run build
  oci_review:
    name: Review final V2 OCI images without host deployment
    needs: [backend, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate strict CI-only review scripts
        run: |
          bash -n app/deploy/mcp-staging/ci_verify_container_images.sh
          bash -n app/deploy/mcp-staging/ci_export_review_oci_images.sh
      - name: Build and inspect disposable V2 runtime image candidates
        run: bash app/deploy/mcp-staging/ci_verify_container_images.sh
      - name: Export immutable OCI review images, not a release
        run: bash app/deploy/mcp-staging/ci_export_review_oci_images.sh
      - name: Upload short-lived review bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prp-v2-meal-oci-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/prp-reviewed-oci-images/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
