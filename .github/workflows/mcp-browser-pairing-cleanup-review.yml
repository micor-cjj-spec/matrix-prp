name: MCP browser pairing cleanup review
on:
  push:
    branches: [fix/mcp-browser-pairing-abort-guard-20261025]
permissions:
  contents: read
jobs:
  web-pairing-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Verify safe redirect and grant-cleanup regressions
        working-directory: app/web
        run: node --experimental-strip-types --test scripts/mcp-browser-pairing.test.mjs
      - name: Typecheck and build root plus /prp/ Web
        working-directory: app/web
        run: |
          npm ci
          npm run build
          VITE_APP_BASE=/prp/ npm run build
          node scripts/verify-deploy-base.mjs /prp/
