name: Bootstrap PRP test lockfile (temporary)
on:
  push:
    branches: [feat/prp-eng-01b-vitest-playwright-20261021]
permissions:
  contents: write
jobs:
  generate-lockfile:
    if: github.repository == 'micor-cjj-spec/matrix-prp' && github.ref == 'refs/heads/feat/prp-eng-01b-vitest-playwright-20261021'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact pinned test dependencies
        working-directory: app/test-automation
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: prp-test-automation-lockfile
          path: app/test-automation/package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit the generated lockfile to this feature branch only
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/prp-eng-01b-vitest-playwright-20261021"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/test-automation/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build(test): lock isolated Vitest and Playwright dependencies"
            git push origin "HEAD:refs/heads/feat/prp-eng-01b-vitest-playwright-20261021"
          fi
