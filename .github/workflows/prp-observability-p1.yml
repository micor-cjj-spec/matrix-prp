name: PRP observability P1 disposable smoke
on:
  pull_request:
    paths:
      - 'app/observability/**'
      - '.github/workflows/prp-observability-p1.yml'
permissions:
  contents: read
jobs:
  isolated-monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Disposable monitoring smoke (no PRP host)
        run: python3 app/observability/ci_smoke.py
