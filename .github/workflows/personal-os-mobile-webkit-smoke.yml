name: Personal OS mobile Chromium/WebKit synthetic owner-review

on:
  pull_request:
    branches: [main]
    paths:
      - app/scripts/personal_os_mobile_browser_smoke.py
      - .github/workflows/personal-os-mobile-webkit-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-os-mobile-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-reviewed-relations:
    name: Personal OS 390/768px synthetic ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install disposable browser, no production dependencies
        run: |
          npm ci --prefix app/web
          python3 -m pip install --no-cache-dir playwright==1.55.0
          python3 -m playwright install --with-deps ${{ matrix.browser }}
      - name: Build exact-source Personal OS Vue application
        env:
          VITE_APP_BASE: /prp/
          VITE_API_BASE: /api
        run: npm run build --prefix app/web
      - name: Owner-click privacy, TASK and REVIEW association in local browser
        env:
          VITE_APP_BASE: /prp/
          VITE_API_BASE: /api
          PRP_OS_BROWSER: ${{ matrix.browser }}
          PRP_OS_MOBILE_URL: http://127.0.0.1:4173/prp/personal-os
          PRP_OS_MOBILE_SHOTS: ${{ runner.temp }}/personal-os-mobile-smoke
        run: |
          set -Eeuo pipefail
          cd app/web
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort \
            > "$RUNNER_TEMP/personal-os-mobile-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl --silent --fail --output /dev/null "$PRP_OS_MOBILE_URL"; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Local Vite preview is not healthy" >&2
            exit 1
          fi
          python3 ../scripts/personal_os_mobile_browser_smoke.py
      - name: Save only synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-os-mobile-synthetic-${{ matrix.browser }}
          path: ${{ runner.temp }}/personal-os-mobile-smoke/
          if-no-files-found: ignore
          retention-days: 7
