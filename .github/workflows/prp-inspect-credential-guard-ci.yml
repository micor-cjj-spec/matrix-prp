name: PRP read-only inspect credential guard (synthetic only)
on:
  pull_request:
    paths:
      - ".github/workflows/prp-readonly-inspect.yml"
      - ".github/workflows/prp-inspect-credential-guard-ci.yml"
      - "app/deploy/preflight_readonly_inspection_env.py"
      - "app/deploy/test_readonly_inspection_connection.py"
  push:
    branches:
      - fix/readonly-inspect-credential-preflight-20261028
permissions:
  contents: read
concurrency:
  group: prp-inspect-guard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-credential-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate fail-closed SSH credential and workflow contract offline
        run: |
          python3 -m unittest discover -s app/deploy -p test_readonly_inspection_connection.py -v
