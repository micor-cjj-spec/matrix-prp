name: PRP observability P2 unified offline integration
on:
  pull_request:
    paths:
      - 'app/observability/**'
      - '.github/workflows/prp-observability-p2-*.yml'
permissions:
  contents: read
jobs:
  unified-projection:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source blobs and unified scrape acceptance
        run: python3 app/observability/integration/ci_integration.py
