name: PRP first-party exact Nginx routes (isolated reviewer)

on:
  push:
    branches:
      - test/mcp-authcode-privatejwt-refresh-20261024
    paths:
      - "app/deploy/mcp-staging/ci_nginx_readonly_link_routes.py"
      - "app/deploy/mcp-staging/approval_routes_pending.py"
      - "app/deploy/mcp-staging/test_readonly_link_routes_pending.py"
      - ".github/workflows/mcp-first-party-nginx-route-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx-review:
    name: Real Nginx syntax and canonical/encoded-alias HTTP matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Nginx binary only on ephemeral runner (no host deployment)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
      - name: Validate reviewed candidate source and shell-free fixture
        run: |
          python3 -m py_compile app/deploy/mcp-staging/ci_nginx_readonly_link_routes.py
          python3 -m unittest discover -s app/deploy/mcp-staging -p test_readonly_link_routes_pending.py -v
      - name: Verify exact canonical raw URI and deny encoded aliases in disposable Nginx
        run: python3 app/deploy/mcp-staging/ci_nginx_readonly_link_routes.py
