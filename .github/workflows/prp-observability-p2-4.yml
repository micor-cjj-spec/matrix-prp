name: PRP observability P2.4 disposable MySQL
on:
  pull_request:
    paths:
      - 'app/observability/p2-4/**'
      - '.github/workflows/prp-observability-p2-4.yml'
permissions:
  contents: read
jobs:
  usage-only-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run isolated MySQL 8.4 and official exporter (no external target)
        run: python3 app/observability/p2-4/ci_mysql.py
