name: PRP Unified Staging S0 Read-only Contract

on:
  pull_request:
    branches: [dev]
    paths:
      - app/scripts/unified_staging_inventory_readonly.py
      - app/scripts/test_unified_staging_inventory_readonly.py
      - .github/workflows/prp-unified-staging-s0-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-inventory-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax check (no host connection)
        run: python3 -m py_compile app/scripts/unified_staging_inventory_readonly.py app/scripts/test_unified_staging_inventory_readonly.py
      - name: Offline synthetic safety tests (no Docker execution)
        run: python3 -m unittest discover -s app/scripts -p test_unified_staging_inventory_readonly.py -v
