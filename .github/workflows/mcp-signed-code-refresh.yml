name: PRP signed OAuth code and offline refresh (isolated)
on:
  push:
    branches: [test/mcp-signed-code-refresh-20261024]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-code-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Keycloak signed browser OAuth + offline refresh + PRP test read
        env:
          MCP_E2E_CRUD: 'false'
        run: bash app/deploy/mcp-oauth/test_full_e2e_ci.sh
