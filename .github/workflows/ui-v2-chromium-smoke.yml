name: UI V2 Chromium smoke (synthetic only)

on:
  pull_request:
    branches: [main]
    paths:
      - app/scripts/ui_v2_browser_smoke.py
      - .github/workflows/ui-v2-chromium-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-v2-chromium-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated Vue preview and Chromium
        run: |
          npm ci --prefix app/web
          python3 -m pip install --no-cache-dir playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Compile actual Vue UI V2
        env:
          VITE_APP_BASE: /prp/
          VITE_API_BASE: /api
        run: npm run build --prefix app/web
      - name: Browser QA (synthetic identity, intercepted API, no backend)
        env:
          PRP_UI_SMOKE_URL: http://127.0.0.1:4173/prp/
          PRP_UI_SMOKE_DIR: ${{ runner.temp }}/prp-ui-v2-smoke
        run: |
          set -Eeuo pipefail
          cd app/web
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort \
            > "$RUNNER_TEMP/ui-v2-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl --silent --fail --output /dev/null "$PRP_UI_SMOKE_URL"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Vite preview did not become healthy" >&2
            exit 1
          fi
          python3 ../scripts/ui_v2_browser_smoke.py
      - name: Save screenshots of synthetic data only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-v2-synthetic-chromium-screenshots
          path: ${{ runner.temp }}/prp-ui-v2-smoke/
          if-no-files-found: ignore
          retention-days: 7
