name: PRP Unified Staging Disposable Runtime Smoke

on:
  pull_request:
    branches: [dev]
    paths:
      - "app/deploy/unified-staging/**"
      - ".github/workflows/prp-unified-staging-runtime-smoke.yml"

permissions:
  contents: read

jobs:
  disposable-full-app:
    # Never deploy a remote host. Each PR runner builds and removes its own
    # MySQL + Java + Web test containers using synthetic-only secrets.
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Refuse non-ephemeral runners and validate script syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "dev"
          bash -n app/deploy/unified-staging/smoke_disposable.sh
      - name: Build + boot + verify + destroy disposable PRP Staging candidate
        shell: bash
        run: bash app/deploy/unified-staging/smoke_disposable.sh
