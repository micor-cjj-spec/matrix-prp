name: PRP MCP producer-side task read architecture (source only)

on:
  push:
    branches:
      - test/mcp-authcode-privatejwt-refresh-20261024
    paths:
      - "app/deploy/mcp-staging/producer_task_read.review.json"
      - "app/deploy/mcp-staging/G0-C-PRODUCTION-TASK-READ-BRIDGE-REVIEW-20261027.md"
      - "app/deploy/mcp-staging/test_producer_task_read_contract.py"
      - "app/backend/src/main/java/com/matrix/prp/tasks/**"
      - "app/backend/src/main/java/com/matrix/prp/auth/security/CurrentUser.java"
      - "app/backend/src/main/java/com/matrix/prp/config/SecurityConfig.java"
      - "app/backend/src/main/java/com/matrix/prp/mcp/PrpMcpTools.java"
      - "app/backend/src/test/java/com/matrix/prp/TaskReadProducerBoundaryTests.java"
      - "app/backend/pom.xml"
      - ".github/workflows/mcp-production-task-read-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect source-only producer task read contract (no server)
        run: |
          python3 -m json.tool app/deploy/mcp-staging/producer_task_read.review.json > /dev/null
          python3 -m py_compile app/deploy/mcp-staging/test_producer_task_read_contract.py
          python3 -m unittest discover -s app/deploy/mcp-staging -p test_producer_task_read_contract.py -v
          echo 'PRODUCER_REVIEW_ONLY_NO_API_NO_REAL_DATA_NO_DEPLOYMENT=YES'

  actual-owner-sql:
    name: Existing MyBatis task read owner/limit boundaries, synthetic identities
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Run only synthetic owner SQL wrapper tests (no MySQL, API, or deployment)
        working-directory: app/backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=TaskReadProducerBoundaryTests test
          echo 'REAL_MYBATIS_QUERY_OWNER_BOUNDARY_WITH_MOCK_MAPPER_ONLY=YES'
