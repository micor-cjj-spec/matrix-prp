name: PRP ops snapshot D offline contract
on:
  pull_request:
    paths:
      - 'app/ops/**'
      - 'app/deploy/systemd/prp-ops-collector.*'
      - 'app/deploy/systemd/prp-ops-mcp.service'
      - '.github/workflows/prp-ops-snapshot-offline.yml'
permissions:
  contents: read
jobs:
  offline-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Synthetic projections, identity separation and disabled service contracts only
        run: python3 -m unittest discover -s app/ops -p 'test_*.py' -v
  loopback-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install wheel-only runtime dependencies in disposable venv
        run: |
          python3 -m venv "$RUNNER_TEMP/prp-ops-runtime"
          "$RUNNER_TEMP/prp-ops-runtime/bin/python" -m pip --isolated install --no-cache-dir --only-binary=:all: --require-hashes -r app/ops/requirements-runtime.lock
          "$RUNNER_TEMP/prp-ops-runtime/bin/python" -m pip check
      - name: Real TLS loopback process with synthetic data only
        run: |
          "$RUNNER_TEMP/prp-ops-runtime/bin/python" app/ops/ci_process_smoke.py
  python-313-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
          architecture: x64
          check-latest: false
      - name: Verify exact target Python and run full offline regression
        run: |
          python -c 'import sys; assert sys.version_info[:3] == (3, 13, 5); print("OPS_TARGET_PYTHON=" + sys.version.split()[0])'
          python -m unittest discover -s app/ops -p 'test_*.py' -v
      - name: Verify locked runtime wheels and real TLS loopback under target Python
        run: |
          python -m venv "$RUNNER_TEMP/prp-ops-runtime-313"
          "$RUNNER_TEMP/prp-ops-runtime-313/bin/python" -m pip --isolated install --no-cache-dir --only-binary=:all: --require-hashes -r app/ops/requirements-runtime.lock
          "$RUNNER_TEMP/prp-ops-runtime-313/bin/python" -m pip check
          "$RUNNER_TEMP/prp-ops-runtime-313/bin/python" app/ops/ci_process_smoke.py
