name: PRP signed evidence isolated fixture
on:
  workflow_dispatch:
    inputs:
      fixture_nonce:
        description: Public synthetic test nonce, never a production job
        type: string
        required: true
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  fixture:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'micor-cjj-spec/matrix-prp' && github.ref == 'refs/heads/fix/mcp-hosted-network-probe-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create synthetic fixture, no production requests or credentials
        shell: bash
        env:
          FIXTURE_NONCE: ${{ inputs.fixture_nonce }}
        run: |
          python3 - <<'PY'
          import os,json,re,pathlib
          nonce=os.environ['FIXTURE_NONCE'];assert re.fullmatch('[0-9a-f]{48}',nonce)
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'synthetic-prp-evidence';p.mkdir(mode=0o700)
          (p/'observations.json').write_text(json.dumps({'kind':'ISOLATED_PROVENANCE_PLUMBING_ONLY','production_acceptance':False,'nonce':nonce},sort_keys=True))
          PY
      - name: Attest only this synthetic fixture
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/synthetic-prp-evidence/observations.json
          create-storage-record: false
          show-summary: false
      - name: Upload public synthetic fixture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prp-provenance-fixture-${{ inputs.fixture_nonce }}
          path: ${{ runner.temp }}/synthetic-prp-evidence/observations.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload public signature bundle, no raw OIDC token
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prp-provenance-bundle-${{ inputs.fixture_nonce }}
          path: ${{ steps.attest.outputs.bundle-path }}
          retention-days: 1
          if-no-files-found: error
