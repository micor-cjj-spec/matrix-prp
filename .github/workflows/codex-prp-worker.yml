# REVIEW ONLY: not installed or authorized for execution.
name: PRP nonce-bound external evidence
run-name: prp-guard-${{ fromJSON(inputs.guard_job).nonce }}
on:
  workflow_dispatch:
    inputs:
      guard_job:
        description: Public root-issued job, never a session key
        type: string
        required: true
      warp_authorized:
        description: Requires separate explicit authorization for full collection
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  collect:
    if: inputs.warp_authorized == true && github.event_name == 'workflow_dispatch' && github.repository == 'micor-cjj-spec/matrix-prp' && github.ref == 'refs/heads/fix/mcp-hosted-network-probe-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Load immutable reviewed sources and collect the exact phase
        env:
          PUBLIC_JOB_JSON: ${{ inputs.guard_job }}
          PRP_WARP_COLLECTION_APPROVED: 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,os,re,json,hashlib,urllib.request,sys,time
          sha=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'prp-guard-collection';root.mkdir(mode=0o700)
          files={'app/deploy/mcp-external-probe/core/disposable_warp_runtime.py': {'local': 'disposable_warp_runtime.py', 'sha256': 'ab2dd823216fc914bec7258ddfd8552cc008a8020d0d3e3d6eb47c554f3dd422'}, 'app/deploy/mcp-external-probe/core/guard_experimental_scheduler.py': {'local': 'guard_experimental_scheduler.py', 'sha256': '9ff90754d9632e90049ce25ab2e38d739472206414b940fffc9fdbe2fb6d703a'}, 'app/deploy/mcp-external-probe/core/guard_external_h2.js': {'local': 'guard_external_h2.js', 'sha256': '1b6f0f46809c5c6c3dd65b77dc54cfa6db5ef04bf6540e3960d1492db91e81e9'}, 'app/deploy/mcp-external-probe/core/guard_external_probe.py': {'local': 'guard_external_probe.py', 'sha256': 'c64c0c12a0b96c134814351769206ec2af0d0b4bf41353cbfc37b8db822ab92a'}, 'app/deploy/mcp-external-probe/core/guard_release_engine.py': {'local': 'guard_release_engine.py', 'sha256': '9d9a4d41b888115f26886c0762a191c1e72d2fe43f7b30f4a1dfb9d12002e431'}, 'app/deploy/mcp-external-probe/core/linux_dns_worker.py': {'local': 'linux_dns_worker.py', 'sha256': '5b40eeeda63017f3f14ccb071213c20cfb617b9475a932137c7775384ed656fe'}, 'app/deploy/mcp-external-probe/core/linux_external_collector.py': {'local': 'linux_external_collector.py', 'sha256': 'f06177d75a3bf8373339c898837f0fc4cf5ad05cd7055289ce83dfb63a56038a'}, 'app/deploy/mcp-external-probe/core/windows_dns_worker.py': {'local': 'windows_dns_worker.py', 'sha256': '33ef2412f52e248cea886fe7d5197a7ad6da4658f951e0ba0aa6526c5f61dccf'}, 'app/deploy/mcp-external-probe/fixtures/manifest.linux.review.json': {'local': 'manifest.json', 'sha256': '941187b94252ae3927b28f7325cc26dc58697b5f68397e731422393126549dca'}}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):raise RuntimeError('SOURCE_REDIRECT_UNAPPROVED')
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          deadline=time.monotonic()+120
          for remote,record in files.items():
           remaining=deadline-time.monotonic();assert remaining>0
           with opener.open('https://raw.githubusercontent.com/micor-cjj-spec/matrix-prp/'+sha+'/'+remote,timeout=min(15,remaining)) as response:
            assert response.status==200;data=response.read(4000001)
           assert len(data)<=4000000 and hashlib.sha256(data).hexdigest()==record['sha256']
           target=root/record['local'];assert target.parent==root;target.write_bytes(data)
          sys.path.insert(0,str(root))
          from linux_external_collector import collect_payload,validate
          from disposable_warp_runtime import WarpRuntime
          job=json.loads(os.environ.pop('PUBLIC_JOB_JSON'))
          manifest=json.loads((root/'manifest.json').read_text())
          pin='09f460ce49b127152b8c5f8e44aca05b5121df6d84d2fcfaf42750d81e70e895'
          validate(job,manifest,pin)
          runtime=WarpRuntime()
          payload=None
          try:
           with runtime:
            payload=collect_payload(job,manifest,pin)
           payload['runtime_cleanup']=runtime.cleanup
           (root/'observations.json').write_text(json.dumps(payload,sort_keys=True,separators=(',',':')))
          except BaseException as error:
           # No untrusted exception text, command output or identity in logs.
           print(json.dumps({'collection_completed':False,'observation_count_before_cleanup':len(payload['observations']) if payload is not None else 0,'failure_type':type(error).__name__,'steps':runtime.steps,'cleanup':runtime.cleanup}))
           sys.exit(1)
          print(json.dumps({'collection_completed':True,'requests':len(payload['observations']),'cleanup':runtime.cleanup}))
          PY
      - name: Attest nonce-bound observations
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/prp-guard-collection/observations.json
          create-storage-record: false
          show-summary: false
      - name: Upload observations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prp-guard-${{ fromJSON(inputs.guard_job).nonce }}
          path: ${{ runner.temp }}/prp-guard-collection/observations.json
          retention-days: 1
          if-no-files-found: error
      - name: Upload public signature bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prp-guard-${{ fromJSON(inputs.guard_job).nonce }}-bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          retention-days: 1
          if-no-files-found: error
