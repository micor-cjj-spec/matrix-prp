# DIAGNOSTIC ONLY. Does not mutate Nginx or produce production evidence.
name: PRP fixed baseline network diagnostic
run-name: prp-baseline-${{ inputs.diagnostic_nonce }}
on:
  workflow_dispatch:
    inputs:
      diagnostic_nonce:
        type: string
        required: true
        description: Public 32-hex diagnostic identity, never a root job nonce
      warp_authorized:
        type: boolean
        required: true
        default: false
        description: Requires one additional explicitly authorized device
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  diagnostic:
    if: inputs.warp_authorized == true && github.event_name == 'workflow_dispatch' && github.repository == 'micor-cjj-spec/matrix-prp' && github.ref == 'refs/heads/fix/mcp-hosted-network-probe-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - name: Measure fixed baseline matrix; never production acceptance
        id: collect
        env:
          DIAGNOSTIC_NONCE: ${{ inputs.diagnostic_nonce }}
          PRP_WARP_COLLECTION_APPROVED: 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,os,re,json,hashlib,urllib.request,sys,time
          sha=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)
          nonce=os.environ['DIAGNOSTIC_NONCE'];assert re.fullmatch('[0-9a-f]{32}',nonce)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'prp-baseline-diagnostic';root.mkdir(mode=0o700)
          files={'app/deploy/mcp-external-probe/core/guard_release_engine.py': {'local': 'guard_release_engine.py', 'sha256': '9d9a4d41b888115f26886c0762a191c1e72d2fe43f7b30f4a1dfb9d12002e431'}, 'app/deploy/mcp-external-probe/core/guard_external_probe.py': {'local': 'guard_external_probe.py', 'sha256': 'c64c0c12a0b96c134814351769206ec2af0d0b4bf41353cbfc37b8db822ab92a'}, 'app/deploy/mcp-external-probe/core/guard_external_h2.js': {'local': 'guard_external_h2.js', 'sha256': '1b6f0f46809c5c6c3dd65b77dc54cfa6db5ef04bf6540e3960d1492db91e81e9'}, 'app/deploy/mcp-external-probe/core/guard_experimental_scheduler.py': {'local': 'guard_experimental_scheduler.py', 'sha256': '9ff90754d9632e90049ce25ab2e38d739472206414b940fffc9fdbe2fb6d703a'}, 'app/deploy/mcp-external-probe/core/windows_dns_worker.py': {'local': 'windows_dns_worker.py', 'sha256': '33ef2412f52e248cea886fe7d5197a7ad6da4658f951e0ba0aa6526c5f61dccf'}, 'app/deploy/mcp-external-probe/core/linux_dns_worker.py': {'local': 'linux_dns_worker.py', 'sha256': '5b40eeeda63017f3f14ccb071213c20cfb617b9475a932137c7775384ed656fe'}, 'app/deploy/mcp-external-probe/core/linux_external_collector.py': {'local': 'linux_external_collector.py', 'sha256': '6de71df1ff8dbae431083ee12bb5b32523cf3e30196f2a0c867ceed9cdd5126d'}, 'app/deploy/mcp-external-probe/core/disposable_warp_runtime.py': {'local': 'disposable_warp_runtime.py', 'sha256': 'ab2dd823216fc914bec7258ddfd8552cc008a8020d0d3e3d6eb47c554f3dd422'}, 'app/deploy/mcp-external-probe/core/baseline_matrix_diagnostic.py': {'local': 'baseline_matrix_diagnostic.py', 'sha256': 'c08f173b8569a876374decb3806ffdb376f751b55b0a39aea83f2a2e317dac07'}, 'app/deploy/mcp-external-probe/fixtures/parent-manifest.json': {'local': 'parent-manifest.json', 'sha256': '0b6ebd6551755dbd171946945ac2565e59642a7aaa8d7015f4c4c874ffd68535'}}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):raise RuntimeError('SOURCE_REDIRECT_UNAPPROVED')
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          deadline=time.monotonic()+120
          for remote,record in files.items():
           remaining=deadline-time.monotonic();assert remaining>0
           with opener.open('https://raw.githubusercontent.com/micor-cjj-spec/matrix-prp/'+sha+'/'+remote,timeout=min(15,remaining)) as response:
            assert response.status==200;data=response.read(4000001)
           assert len(data)<=4000000 and hashlib.sha256(data).hexdigest()==record['sha256']
           target=root/record['local'];assert target.parent==root;target.write_bytes(data)
          sys.path.insert(0,str(root))
          from baseline_matrix_diagnostic import diagnose,validate
          from disposable_warp_runtime import WarpRuntime
          manifest=json.loads((root/'parent-manifest.json').read_text());validate(manifest)
          runtime=WarpRuntime()
          result={'kind':'BASELINE_DIAGNOSTIC_ONLY','production_acceptance':False,'diagnostic_nonce':nonce,'diagnostic_completed':False}
          try:
           with runtime:
            result.update(diagnose(manifest))
           result['diagnostic_completed']=result.get('completed_requests')==682 and result.get('failure_type') is None
          except BaseException as error:
           result['runner_failure_type']=type(error).__name__ if type(error).__name__ in {'RuntimeErrorSafe','GateError','TimeoutError'} else 'OTHER_EXCEPTION'
          result.update(cleanup=runtime.cleanup,runtime_steps=runtime.steps)
          (root/'diagnostics.json').write_text(json.dumps(result,sort_keys=True,separators=(',',':')))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('report_ready=true\n')
          print(json.dumps(result,sort_keys=True))
          sys.exit(0 if result['diagnostic_completed'] else 1)
          PY
      - name: Attest diagnostic summary only
        id: attest
        if: always() && steps.collect.outputs.report_ready == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/prp-baseline-diagnostic/diagnostics.json
          create-storage-record: false
          show-summary: false
      - name: Preserve diagnostic summary, including failed diagnostics
        if: always() && steps.collect.outputs.report_ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prp-baseline-${{ inputs.diagnostic_nonce }}
          path: ${{ runner.temp }}/prp-baseline-diagnostic/diagnostics.json
          retention-days: 1
          if-no-files-found: error
      - name: Preserve diagnostic signature bundle
        if: always() && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prp-baseline-${{ inputs.diagnostic_nonce }}-bundle
          path: ${{ steps.attest.outputs.bundle-path }}
          retention-days: 1
          if-no-files-found: error
