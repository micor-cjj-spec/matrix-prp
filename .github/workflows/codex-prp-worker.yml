name: PRP external network capability probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/mcp-hosted-network-probe-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Two normal public HTTPS controls; no credentials or checkout
        shell: bash
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          rows=[]
          for family,address in [(4,'207.57.123.94'),(6,'[2001:df1:7880:6::63]')]:
              start=time.monotonic()
              command=['curl','-'+str(family),'--noproxy','*','--silent',
                  '--proto','=https','--connect-timeout','8','--max-time','15',
                  '--resolve','micor.top:443:'+address,'--output','/dev/null',
                  '--write-out','%{http_code} %{ssl_verify_result}',
                  'https://micor.top/prp/api/health']
              try:
                  result=subprocess.run(command,capture_output=True,text=True,timeout=18)
                  parts=result.stdout.strip().split()
                  valid=len(parts)==2 and all(x.isdigit() for x in parts)
                  rows.append(dict(family=family,curl_exit=result.returncode,
                      http_status=int(parts[0]) if valid else None,
                      tls_verify=int(parts[1]) if valid else None,
                      elapsed_seconds=round(time.monotonic()-start,3),
                      normal_https_reachable=bool(valid and result.returncode==0 and parts==['200','0'])))
              except subprocess.TimeoutExpired:
                  rows.append(dict(family=family,process_timeout=True,normal_https_reachable=False))
          report=dict(kind='external_hosted_runner_capability_only',
              production_acceptance=False,security_denial_verified=False,
              credentials_used=False,retries=0,requests=rows)
          print(json.dumps(report,sort_keys=True))
          PY
