name: PRP unsigned Linux collector regressions
on:
  workflow_dispatch:
permissions: {}
jobs:
  unit:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'micor-cjj-spec/matrix-prp' && github.ref == 'refs/heads/fix/mcp-hosted-network-probe-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify immutable source bytes and run isolated Linux unit tests
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,os,re,json,hashlib,urllib.request,unittest,io,sys,time
          sha=os.environ['GITHUB_SHA'];assert re.fullmatch('[0-9a-f]{40}',sha)
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'prp-linux-worker-units';root.mkdir(mode=0o700)
          files={'app/deploy/mcp-external-probe/core/guard_experimental_scheduler.py': {'local': 'release-v4/guard_experimental_scheduler.py', 'sha256': '9ff90754d9632e90049ce25ab2e38d739472206414b940fffc9fdbe2fb6d703a'}, 'app/deploy/mcp-external-probe/core/guard_external_h2.js': {'local': 'release-v4/guard_external_h2.js', 'sha256': '1b6f0f46809c5c6c3dd65b77dc54cfa6db5ef04bf6540e3960d1492db91e81e9'}, 'app/deploy/mcp-external-probe/core/guard_external_probe.py': {'local': 'release-v4/guard_external_probe.py', 'sha256': 'c64c0c12a0b96c134814351769206ec2af0d0b4bf41353cbfc37b8db822ab92a'}, 'app/deploy/mcp-external-probe/core/guard_release_engine.py': {'local': 'release-v4/guard_release_engine.py', 'sha256': '9d9a4d41b888115f26886c0762a191c1e72d2fe43f7b30f4a1dfb9d12002e431'}, 'app/deploy/mcp-external-probe/core/linux_dns_worker.py': {'local': 'release-v4/linux_dns_worker.py', 'sha256': '5b40eeeda63017f3f14ccb071213c20cfb617b9475a932137c7775384ed656fe'}, 'app/deploy/mcp-external-probe/core/linux_external_collector.py': {'local': 'release-v4/linux_external_collector.py', 'sha256': 'f06177d75a3bf8373339c898837f0fc4cf5ad05cd7055289ce83dfb63a56038a'}, 'app/deploy/mcp-external-probe/core/windows_dns_worker.py': {'local': 'release-v4/windows_dns_worker.py', 'sha256': '33ef2412f52e248cea886fe7d5197a7ad6da4658f951e0ba0aa6526c5f61dccf'}, 'app/deploy/mcp-external-probe/tests/test_linux_dns_worker.py': {'local': 'tests/test_linux_dns_worker.py', 'sha256': 'f9e1f80ddeef547fc34ef7052ce4d0af766dd3649e072a7733c2e44169b62b24'}, 'app/deploy/mcp-external-probe/tests/test_linux_external_collector.py': {'local': 'tests/test_linux_external_collector.py', 'sha256': 'de2836f0710cbfb6518458a7c5719489132b88cd45dec179b27654086742b0d6'}, 'app/deploy/mcp-external-probe/fixtures/parent-manifest.json': {'local': 'release-v4/manifest.candidate.json', 'sha256': '0b6ebd6551755dbd171946945ac2565e59642a7aaa8d7015f4c4c874ffd68535'}}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self,*args,**kwargs):raise RuntimeError('SOURCE_REDIRECT_UNAPPROVED')
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect())
          deadline=time.monotonic()+120
          for remote,record in files.items():
           remaining=deadline-time.monotonic();assert remaining>0
           with opener.open('https://raw.githubusercontent.com/micor-cjj-spec/matrix-prp/'+sha+'/'+remote,timeout=min(15,remaining)) as response:
            assert response.status==200;data=response.read(4000001)
           assert len(data)<=4000000 and hashlib.sha256(data).hexdigest()==record['sha256']
           target=root/record['local'];assert target.resolve().is_relative_to(root.resolve());target.parent.mkdir(exist_ok=True);target.write_bytes(data)
          sys.path.insert(0,str(root/'release-v4'))
          suite=unittest.defaultTestLoader.discover(str(root/'tests'),pattern='test_linux*.py');stream=io.StringIO();result=unittest.TextTestRunner(stream=stream,verbosity=2).run(suite)
          (root/'unit.private.log').write_text(stream.getvalue())
          print(json.dumps({'kind':'linux_worker_offline_regressions','source_files_verified':len(files),'tests_run':result.testsRun,'failures':len(result.failures),'errors':len(result.errors),'skips':len(result.skipped),'production_acceptance':False,'production_requests':0,'warp_used':False},sort_keys=True))
          assert result.testsRun==15 and result.wasSuccessful() and not result.skipped
          PY
