name: PRP Linux DNS adapter actual verification
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'micor-cjj-spec/matrix-prp' && github.ref == 'refs/heads/fix/mcp-hosted-network-probe-20261024'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fixed-source DNS and parser regressions; no credentials or WARP
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,json,base64,subprocess,os,sys,shutil,collections,hashlib
          w=pathlib.Path(os.environ['RUNNER_TEMP'])/'prp-linux-dns';w.mkdir(mode=0o700)
          files={'linux_dns_worker.py': '', 'test_linux_dns_worker.py': '', 'guard_release_engine.py': '', 'windows_dns_worker.py': ''}
          for n,b in files.items():(w/n).write_bytes(base64.b64decode(b))
          u=subprocess.run(['python3','-m','unittest','test_linux_dns_worker','-v'],cwd=w,capture_output=True,timeout=20)
          r={'kind':'linux_dns_adapter_actual_check','production_acceptance':False,'warp_used':False,'unit_exit':u.returncode,'dig_available':shutil.which('dig') is not None,'live_dns_executed':False,'sources':{n:hashlib.sha256((w/n).read_bytes()).hexdigest() for n in files}}
          if u.returncode==0 and r['dig_available']:
           sys.path.insert(0,str(w));import linux_dns_worker as dns
           r['live_dns_executed']=True
           try:
            rows=dns.dns_linux(sorted(dns.HOSTS),sorted(dns.SOURCES));r.update(dns_contract_passed=True,rows=len(rows),queries=sum(len(x['queries']) for x in rows),all_a_expected=all(x['a']==['207.57.123.94'] for x in rows),all_aaaa_empty=all(x['aaaa']==[] for x in rows))
           except Exception as exc:
            r.update(dns_contract_passed=False,error_type=type(exc).__name__)
            if dns.LAST_TRACE:
             ends=[x for x in dns.LAST_TRACE['events'] if x.get('event')=='QUERY_END'];r['queries_finished']=len(ends);r['query_errors']=dict(collections.Counter(x['error_class'] for x in ends if not x['query_ok']))
           r['elapsed_ms']=dns.LAST_TRACE['total_ms'] if dns.LAST_TRACE else None
          print(json.dumps(r,sort_keys=True))
          PY
