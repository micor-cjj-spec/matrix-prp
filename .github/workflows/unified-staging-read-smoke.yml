name: Unified Staging read smoke (offline only)

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'app/scripts/unified_staging_read_smoke*'
      - 'app/scripts/unified_staging_smoke_review*'
      - '.github/workflows/unified-staging-read-smoke.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic contract tests only
        run: node --test app/scripts/unified_staging_read_smoke.test.cjs app/scripts/unified_staging_smoke_review.test.cjs
      - name: Print fixture summary (not live evidence)
        run: node app/scripts/unified_staging_smoke_review.cjs --fixture
