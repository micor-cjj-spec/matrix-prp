name: Unified Staging read smoke (offline only)

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'app/scripts/unified_staging_read_smoke*'
      - 'app/scripts/unified_staging_smoke_review*'
      - 'app/scripts/unified_staging_live_runner*'
      - 'app/scripts/unified_staging_task_request*'
      - 'app/scripts/unified_staging_task_receipt*'
      - 'app/scripts/provision_unified_staging_uat*'
      - 'app/scripts/test_unified_staging_s5_fixture.py'
      - 'app/scripts/unified_staging_s5_recovery.py'
      - 'app/scripts/fixtures/unified_396_s5_operator.py.txt'
      - '.github/workflows/unified-staging-read-smoke.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run synthetic contract tests only
        run: node --test app/scripts/unified_staging_read_smoke.test.cjs app/scripts/unified_staging_smoke_review.test.cjs app/scripts/unified_staging_live_runner.test.cjs app/scripts/unified_staging_task_request.test.cjs app/scripts/unified_staging_task_receipt.test.cjs
      - name: Print fixture summary (not live evidence)
        run: node app/scripts/unified_staging_smoke_review.cjs --fixture
      - name: Run mocked staging provisioning and GET-only smoke contract tests
        run: python3 -m unittest discover -s app/scripts -p 'test_provision_unified_staging_uat.py'
      - name: Rehearse pinned S5 business regression with fake transport only
        run: python3 -m unittest discover -s app/scripts -p 'test_unified_staging_s5_fixture.py' -v
