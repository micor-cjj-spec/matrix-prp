name: PRP Dev Collaboration Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/scripts/dev-collab/**'
      - 'app/docs/dev-collab/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/workflows/prp-dev-collab-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-collab-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test cross-session state machine and safety rules
        run: node --test app/scripts/dev-collab/core.test.mjs
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
