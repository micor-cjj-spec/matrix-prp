name: CI

on:
  push:
    branches: [main, feat/multi-user-foundation]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Run backend tests
        working-directory: app/backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install dependencies
        working-directory: app/web
        run: npm ci
      - name: Typecheck and build Web
        working-directory: app/web
        run: npm run build

  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: app/mobile
        run: npm ci
      - name: Typecheck and build Mobile H5
        working-directory: app/mobile
        run: |
          npm run type-check
          npm run build:h5
