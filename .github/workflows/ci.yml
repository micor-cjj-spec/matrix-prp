name: CI

on:
  push:
    branches: [main, feat/multi-user-foundation]
  pull_request:
    branches: [main, fix/mcp-v24-lineage-conflict-20261022]

jobs:
  controller-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed production controller migration compatibility
        run: python3 app/deploy/check_controller_compatibility.py
      - name: Exercise exact reviewed production preservation guards
        run: python3 -m unittest discover -s app/deploy -p test_approved_controller.py

  spring-ai-compatibility-spike:
    # Independent Maven project; no Spring AI dependency is added to app/backend.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            app/backend/pom.xml
            app/experiments/spring-ai-spike/pom.xml
      - name: Spring AI 1.1 offline DeepSeek compatibility tests
        working-directory: app/backend
        run: |
          chmod +x mvnw
          ./mvnw -B -f ../experiments/spring-ai-spike/pom.xml test

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Run backend tests
        working-directory: app/backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install dependencies
        working-directory: app/web
        run: npm ci
      - name: Typecheck and build Web
        working-directory: app/web
        run: npm run build
      - name: Verify future migration registry contracts
        run: node --test app/scripts/migration-policy-contract.test.mjs
      - name: Check source text encoding
        run: node app/scripts/check-text-encoding.mjs
      - name: Audit manual Codex Worker boundaries
        run: node --test app/scripts/codex-worker-contract.test.mjs
      - name: Verify /prp/ production path build
        working-directory: app/web
        run: |
          VITE_APP_BASE=/prp/ npm run build
          node scripts/verify-deploy-base.mjs /prp/

  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: app/mobile
        run: npm ci
      - name: Typecheck and build Mobile H5
        working-directory: app/mobile
        run: |
          npm run type-check
          npm run build:h5

  video-db-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: matrix_prp
          MYSQL_USER: matrix_prp
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Apply video schema to real MySQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
          for schema in app/docker/mysql/init/*.sql; do
            MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp < "$schema"
          done
          # Keep integration DB aligned with all immutable migrations after the historical V1-V7 bootstrap.
          for schema in $(find app/backend/src/main/resources/db/migration -name 'V*__*.sql' | sort -V); do
            version=$(basename "$schema" | sed -E 's/V([0-9]+)__.*/\1/')
            if [ "$version" -gt 7 ]; then
              MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp < "$schema"
            fi
          done
      - name: Verify video, private notification and wellness rules against MySQL
        working-directory: app/backend
        env:
          MATRIX_PRP_DB_PASSWORD: ci-app-password
          MATRIX_PRP_BOOTSTRAP_USERNAME: video_admin
          MATRIX_PRP_BOOTSTRAP_PASSWORD: video-test-admin-password-2026
          MATRIX_PRP_JWT_SECRET: ci-integration-only-secret-key-at-least-32-bytes
          MATRIX_PRP_VIDEO_ROOT: ${{ runner.temp }}/prp-video-it
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=VideoDatabaseIT,NotificationDatabaseIT,WellnessDatabaseIT,AiDatabaseIT,AgentTaskDatabaseIT,CodexJobDatabaseIT,FinanceLedgerDatabaseIT,FinanceImportDatabaseIT,McpDatabaseIT,McpClientGrantDatabaseIT,McpIdentityLinkDatabaseIT test


  deployment-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test production deployment data-preservation rules
        run: python3 -m unittest discover -s app/deploy -p 'test_*.py' -v
      - name: Validate OAuth authorization metadata preflight fixtures
        run: python3 -m unittest discover -s app/deploy/mcp-oauth -p 'test_*.py' -v
      - name: Validate isolated MCP staging configuration guards
        run: python3 -m unittest discover -s app/deploy/mcp-staging -p 'test_*.py' -v

  db-migration-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: matrix_prp
          MYSQL_USER: matrix_prp
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert historical scripts match Flyway immutable migrations
        run: node app/scripts/verify-db-migrations.mjs
      - name: Create empty and legacy CI schemas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
          MYSQL_PWD=ci-root-password mysql -h 127.0.0.1 -uroot -e "
            CREATE DATABASE matrix_prp_flyway CHARACTER SET utf8mb4;
            CREATE DATABASE matrix_prp_legacy CHARACTER SET utf8mb4;
            GRANT ALL PRIVILEGES ON matrix_prp_flyway.* TO 'matrix_prp'@'%';
            GRANT ALL PRIVILEGES ON matrix_prp_legacy.* TO 'matrix_prp'@'%';"
          for schema in app/docker/mysql/init/*.sql; do
            MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp_legacy < "$schema"
          done
      - name: Verify read-only legacy baseline gate
        env:
          MYSQL_PWD: ci-app-password
          MATRIX_PRP_DB_NAME: matrix_prp_legacy
          MATRIX_PRP_DB_HOST: 127.0.0.1
        run: node app/scripts/verify-legacy-baseline.mjs
      - name: Run migration and preserved-row integration tests
        working-directory: app/backend
        env:
          MATRIX_PRP_FLYWAY_FRESH_URL: jdbc:mysql://127.0.0.1:3306/matrix_prp_flyway?useSSL=false
          MATRIX_PRP_FLYWAY_LEGACY_URL: jdbc:mysql://127.0.0.1:3306/matrix_prp_legacy?useSSL=false
          MATRIX_PRP_FLYWAY_DB_USER: matrix_prp
          MATRIX_PRP_FLYWAY_DB_PASSWORD: ci-app-password
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=FlywayMigrationIT test

  keycloak-oauth-ephemeral:
    # Only PR #95/its feature branch. A disposable GitHub runner, not PRP production.
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/prp-mcp-gateway-v1' || github.head_ref == 'feat/mcp-owner-crud-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate exact Keycloak resource and read-only PKCE client
        run: |
          python3 app/deploy/mcp-oauth/build_realm.py \
            --resource https://prp.staging.example.org/api/mcp \
            --staging-client-id prp-pkce-probe \
            --staging-redirect http://127.0.0.1:8765/callback
      - name: Verify actual Keycloak import and PKCE settings using loopback only
        shell: bash
        run: |
          set -euo pipefail
          admin_secret="$(openssl rand -hex 32)"
          echo "::add-mask::${admin_secret}"
          trap 'docker rm -f prp-mcp-keycloak-ci >/dev/null 2>&1 || true' EXIT
          docker run --rm -d \
            --name prp-mcp-keycloak-ci \
            -p 127.0.0.1:18080:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=prp-smoke-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="${admin_secret}" \
            -v "${PWD}/app/deploy/mcp-oauth/.generated/realm:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.8.0 \
            start-dev --import-realm --features=cimd,resource-indicators \
            --hostname=http://127.0.0.1:18080
          MCP_TEST_ADMIN_PASSWORD="${admin_secret}" \
            python3 app/deploy/mcp-oauth/keycloak_ephemeral_smoke.py \
              --admin-user prp-smoke-admin

  nginx-oauth-ephemeral:
    # Runs only for the review branch: isolated HTTPS Nginx and fake backend.
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/prp-mcp-gateway-v1' || github.head_ref == 'feat/mcp-owner-crud-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Test actual TLS/Host forwarding and MCP path preservation with Nginx
        run: bash app/deploy/mcp-oauth/test_nginx_ephemeral.sh

  mcp-staging-compose:
    # Real Docker Compose parse with freshly generated disposable secrets.
    # No containers started, no production resources used.
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/prp-mcp-gateway-v1' || github.head_ref == 'feat/mcp-owner-crud-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable staging-only environment and validate isolation
        working-directory: app/deploy/mcp-staging
        run: |
          python3 prepare_env.py
          python3 check_env.py --env-file .env
          docker compose --project-name prp-mcp-stage --env-file .env -f compose.yaml config --quiet
          test "$(stat -c '%a' .env)" = 600
          test "$(docker compose --project-name prp-mcp-stage --env-file .env -f compose.yaml config --services | wc -l)" = 3
      - name: Reject accidental live/anonymous MCP settings
        working-directory: app/deploy/mcp-staging
        run: |
          sed -i 's/PRP_STAGE_MCP_ENABLED=false/PRP_STAGE_MCP_ENABLED=true/' .env
          if python3 check_env.py --env-file .env; then
            echo 'ERROR: staging guard accepted MCP without OAuth'
            exit 1
          fi
          sed -i 's/PRP_STAGE_MCP_ENABLED=true/PRP_STAGE_MCP_ENABLED=false/' .env
          sed -i 's/PRP_STAGE_PUBLIC_HOST=prp-test.micor.top/PRP_STAGE_PUBLIC_HOST=micor.top/' .env
          if python3 check_env.py --env-file .env; then
            echo 'ERROR: staging guard accepted the production domain'
            exit 1
          fi
          echo 'PASS: staging Compose is valid and unsafe enablement is rejected.'

  mcp-staging-runtime:
    # Build and boot real PRP images with brand-new MySQL on disposable runner.
    # No server credentials, no PRP production data or environment access.
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/prp-mcp-gateway-v1' || github.head_ref == 'feat/mcp-owner-crud-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Real isolated PRP staging build, Flyway V27 and loopback Web/API smoke
        run: bash app/deploy/mcp-staging/smoke_disposable.sh

  mcp-staging-tls:
    # Real TLS reverse-proxy acceptance using disposable local secrets and mocks.
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/prp-mcp-gateway-v1' || github.head_ref == 'feat/mcp-owner-crud-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Validate isolated HTTPS staging virtual hosts and Keycloak admin isolation
        run: bash app/deploy/mcp-staging/test_tls_ephemeral.sh

  mcp-real-pkce-e2e:
    # Full disposable CI: live Keycloak browser login+PKCE, fresh PRP MySQL,
    # TLS trusted JWKS, first-party owner grant/link and OAuth MCP tool calls.
    # No prod DNS, no user data, no external server access.
    if: github.event_name == 'pull_request' && (github.head_ref == 'feat/prp-mcp-gateway-v1' || github.head_ref == 'feat/mcp-owner-crud-20261023')
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Run real ephemeral PKCE + owner link + MCP read/revoke end-to-end
        run: bash app/deploy/mcp-oauth/test_full_e2e_ci.sh

  safe-deployment-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate diagnostic syntax and permission boundaries
        run: |
          python3 -m venv /tmp/prp-diagnostic-tests
          /tmp/prp-diagnostic-tests/bin/pip install PyYAML==6.0.3
          /tmp/prp-diagnostic-tests/bin/python -m unittest discover -s app/deploy -v
          bash -n app/deploy/admin_install_diagnostic.sh
          sh -n app/deploy/ssh-gateway.sh
          node --test app/scripts/deploy-workflow-contract.test.mjs
