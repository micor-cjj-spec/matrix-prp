name: CI

on:
  push:
    branches: [main, feat/multi-user-foundation]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Run backend tests
        working-directory: app/backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install dependencies
        working-directory: app/web
        run: npm ci
      - name: Typecheck and build Web
        working-directory: app/web
        run: npm run build
      - name: Verify /prp/ production path build
        working-directory: app/web
        run: |
          VITE_APP_BASE=/prp/ npm run build
          node scripts/verify-deploy-base.mjs /prp/

  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: app/mobile
        run: npm ci
      - name: Typecheck and build Mobile H5
        working-directory: app/mobile
        run: |
          npm run type-check
          npm run build:h5

  video-db-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: matrix_prp
          MYSQL_USER: matrix_prp
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Apply video schema to real MySQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
          for schema in app/docker/mysql/init/*.sql; do
            MYSQL_PWD=ci-app-password mysql -h 127.0.0.1 -u matrix_prp matrix_prp < "$schema"
          done
      - name: Verify video, private notification and wellness rules against MySQL
        working-directory: app/backend
        env:
          MATRIX_PRP_DB_PASSWORD: ci-app-password
          MATRIX_PRP_BOOTSTRAP_USERNAME: video_admin
          MATRIX_PRP_BOOTSTRAP_PASSWORD: video-test-admin-password-2026
          MATRIX_PRP_JWT_SECRET: ci-integration-only-secret-key-at-least-32-bytes
          MATRIX_PRP_VIDEO_ROOT: ${{ runner.temp }}/prp-video-it
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=VideoDatabaseIT,NotificationDatabaseIT,WellnessDatabaseIT test

