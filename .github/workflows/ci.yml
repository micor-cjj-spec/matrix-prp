name: CI

on:
  push:
    branches: [main, feat/multi-user-foundation]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Run backend tests
        working-directory: app/backend
        run: |
          chmod +x mvnw
          ./mvnw -B test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Install dependencies
        working-directory: app/web
        run: npm ci
      - name: Typecheck and build Web
        working-directory: app/web
        run: npm run build
      - name: Check source text encoding
        run: node app/scripts/check-text-encoding.mjs
      - name: Audit manual Codex Worker boundaries
        run: node --test app/scripts/codex-worker-contract.test.mjs
      - name: Verify /prp/ production path build
        working-directory: app/web
        run: |
          VITE_APP_BASE=/prp/ npm run build
          node scripts/verify-deploy-base.mjs /prp/

  mobile-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: app/mobile
        run: npm ci
      - name: Typecheck and build Mobile H5
        working-directory: app/mobile
        run: |
          npm run type-check
          npm run build:h5

  video-db-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: matrix_prp
          MYSQL_USER: matrix_prp
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Apply video schema to real MySQL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
          for schema in app/docker/mysql/init/*.sql; do
            MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp < "$schema"
          done
          # AI is an additive V8 migration; initialize only the isolated CI database.
          MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp < app/backend/src/main/resources/db/migration/V8__ai_orchestrator.sql
          MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp < app/backend/src/main/resources/db/migration/V9__ai_provider_settings.sql
          MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp < app/backend/src/main/resources/db/migration/V10__openclaw_agent_tasks.sql
          MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp < app/backend/src/main/resources/db/migration/V11__codex_review_jobs.sql
          MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp < app/backend/src/main/resources/db/migration/V12__repair_legacy_food_seed_encoding.sql
      - name: Verify video, private notification and wellness rules against MySQL
        working-directory: app/backend
        env:
          MATRIX_PRP_DB_PASSWORD: ci-app-password
          MATRIX_PRP_BOOTSTRAP_USERNAME: video_admin
          MATRIX_PRP_BOOTSTRAP_PASSWORD: video-test-admin-password-2026
          MATRIX_PRP_JWT_SECRET: ci-integration-only-secret-key-at-least-32-bytes
          MATRIX_PRP_VIDEO_ROOT: ${{ runner.temp }}/prp-video-it
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=VideoDatabaseIT,NotificationDatabaseIT,WellnessDatabaseIT,AiDatabaseIT,AgentTaskDatabaseIT,CodexJobDatabaseIT test


  db-migration-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: matrix_prp
          MYSQL_USER: matrix_prp
          MYSQL_PASSWORD: ci-app-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert historical scripts match Flyway immutable migrations
        run: node app/scripts/verify-db-migrations.mjs
      - name: Create empty and legacy CI schemas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
          MYSQL_PWD=ci-root-password mysql -h 127.0.0.1 -uroot -e "
            CREATE DATABASE matrix_prp_flyway CHARACTER SET utf8mb4;
            CREATE DATABASE matrix_prp_legacy CHARACTER SET utf8mb4;
            GRANT ALL PRIVILEGES ON matrix_prp_flyway.* TO 'matrix_prp'@'%';
            GRANT ALL PRIVILEGES ON matrix_prp_legacy.* TO 'matrix_prp'@'%';"
          for schema in app/docker/mysql/init/*.sql; do
            MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp_legacy < "$schema"
          done
      - name: Verify read-only legacy baseline gate
        env:
          MYSQL_PWD: ci-app-password
          MATRIX_PRP_DB_NAME: matrix_prp_legacy
          MATRIX_PRP_DB_HOST: 127.0.0.1
        run: node app/scripts/verify-legacy-baseline.mjs
      - name: Run migration and preserved-row integration tests
        working-directory: app/backend
        env:
          MATRIX_PRP_FLYWAY_FRESH_URL: jdbc:mysql://127.0.0.1:3306/matrix_prp_flyway?useSSL=false
          MATRIX_PRP_FLYWAY_LEGACY_URL: jdbc:mysql://127.0.0.1:3306/matrix_prp_legacy?useSSL=false
          MATRIX_PRP_FLYWAY_DB_USER: matrix_prp
          MATRIX_PRP_FLYWAY_DB_PASSWORD: ci-app-password
        run: |
          chmod +x mvnw
          ./mvnw -B -Dtest=FlywayMigrationIT test
