name: PRP MCP full Flyway V24 backup restore V28 (synthetic CI only)

on:
  push:
    branches:
      - test/mcp-authcode-privatejwt-refresh-20261024
    paths:
      - ".github/workflows/mcp-full-v24-backup-restore-review.yml"
      - "app/backend/src/test/java/com/matrix/prp/IsolatedV24BackupRestoreMcpV28IT.java"
      - "app/backend/src/main/resources/db/migration/**"
      - "app/backend/pom.xml"
  pull_request:
    branches:
      - test/mcp-authcode-privatejwt-refresh-20261024
    paths:
      - ".github/workflows/mcp-full-v24-backup-restore-review.yml"
      - "app/backend/src/test/java/com/matrix/prp/IsolatedV24BackupRestoreMcpV28IT.java"
      - "app/backend/src/main/resources/db/migration/**"
      - "app/backend/pom.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-v24-backup-restore:
    name: Genuine Flyway V7-baselined V24 source, mysqldump, separate V28 clone
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Enforce V1-V24 byte identity with original main
        shell: bash
        run: |
          set -Eeuo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          n=0
          while IFS= read -r path; do
            filename="${path##*/}"
            [[ "$filename" =~ ^V([0-9]+)__.*\.sql$ ]] || continue
            if (( 10#${BASH_REMATCH[1]} <= 24 )); then
              test "$(git rev-parse "origin/main:$path")" = "$(git rev-parse "HEAD:$path")" || {
                echo "CI_V1_V24_MIGRATION_SOURCE_DRIFT" >&2
                exit 2
              }
              n=$((n + 1))
            fi
          done < <(git ls-tree -r --name-only origin/main -- app/backend/src/main/resources/db/migration/)
          test "$n" -eq 24
          echo "CI_ORIGINAL_V1_V24_MIGRATION_BLOBS_UNCHANGED=YES"
      - name: Build real Flyway V24, dump, restore, V28 clone and verify intact
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true ||
                "${RUNNER_OS:-}" != Linux ||
                ! "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ ||
                -z "${RUNNER_TEMP:-}" ]]; then
            echo "CI_ONLY_NO_OPERATOR_DB" >&2
            exit 2
          fi
          umask 077
          src="prp-ci-full-v24-src-${GITHUB_RUN_ID}"
          dst="prp-ci-full-v28-clone-${GITHUB_RUN_ID}"
          net="prp-ci-full-v24-net-${GITHUB_RUN_ID}"
          src_vol="prp-ci-full-v24-data-${GITHUB_RUN_ID}"
          dst_vol="prp-ci-full-v28-data-${GITHUB_RUN_ID}"
          dir="$(mktemp -d "${RUNNER_TEMP}/prp-ci-full-restore.XXXXXXXX")"
          cleanup() {
            docker rm -f "$src" "$dst" >/dev/null 2>&1 || true
            docker volume rm "$src_vol" "$dst_vol" >/dev/null 2>&1 || true
            docker network rm "$net" >/dev/null 2>&1 || true
            rm -f -- "$dir/full-synthetic.sql" "$dir/tampered.sql" || true
            rmdir -- "$dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          # CI's host-side Flyway tests use 127.0.0.1 published ports.
          # Docker --internal rejects host-to-container forwarded ingress;
          # use a unique user-defined bridge here, with both published
          # endpoints explicitly pinned to host LOOPBACK only.
          # The production runbook still requires no public DB ports.
          docker network create "$net" >/dev/null
          docker volume create "$src_vol" >/dev/null
          docker volume create "$dst_vol" >/dev/null
          rootpw="$(openssl rand -hex 24)"
          export MATRIX_PRP_DB_PASSWORD="$(openssl rand -hex 24)"
          export MATRIX_PRP_DB_USER=prp_upgrade_ci
          export PRP_CI_FULL_SCHEMA_RESTORE_ONLY=YES
          export PRP_CI_MYSQL_SOURCE_URL="jdbc:mysql://127.0.0.1:13308/matrix_prp_upgrade_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
          export PRP_CI_MYSQL_CLONE_URL="jdbc:mysql://127.0.0.1:13309/matrix_prp_upgrade_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
          docker run -d --rm --name "$src" --network "$net" \
            -p 127.0.0.1:13308:3306 --memory 1536m --cpus 1.25 \
            --mount "type=volume,source=$src_vol,target=/var/lib/mysql" \
            -e MYSQL_ROOT_PASSWORD="$rootpw" \
            -e MYSQL_DATABASE=matrix_prp_upgrade_ci \
            -e MYSQL_USER="$MATRIX_PRP_DB_USER" \
            -e MYSQL_PASSWORD="$MATRIX_PRP_DB_PASSWORD" \
            mysql:8.4 >/dev/null
          docker run -d --rm --name "$dst" --network "$net" \
            -p 127.0.0.1:13309:3306 --memory 1536m --cpus 1.25 \
            --mount "type=volume,source=$dst_vol,target=/var/lib/mysql" \
            -e MYSQL_ROOT_PASSWORD="$rootpw" \
            -e MYSQL_DATABASE=matrix_prp_upgrade_ci \
            -e MYSQL_USER="$MATRIX_PRP_DB_USER" \
            -e MYSQL_PASSWORD="$MATRIX_PRP_DB_PASSWORD" \
            mysql:8.4 >/dev/null
          for name in "$src" "$dst"; do
            ready=0
            for attempt in $(seq 1 75); do
              if docker exec -e MYSQL_PWD="$rootpw" "$name" \
                mysql --protocol=TCP -h127.0.0.1 -uroot \
                -D matrix_prp_upgrade_ci -Nse 'SELECT 1' >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 2
            done
            test "$ready" = 1 || { echo "CI_DISPOSABLE_MYSQL_NOT_READY"; exit 1; }
          done
          cd app/backend
          chmod +x mvnw
          export PRP_CI_FULL_SCHEMA_PHASE=seed
          ./mvnw -B -ntp -Dtest=IsolatedV24BackupRestoreMcpV28IT test
          # A genuine V7-baselined, fully migrated V24 synthetic
          # database is now in SRC. Its true schema/rows/history are
          # emitted to a job-private temporary file ONLY on CI.
          docker exec -e MYSQL_PWD="$rootpw" "$src" \
            mysqldump --protocol=TCP -h127.0.0.1 -uroot \
            --single-transaction --quick --hex-blob --routines \
            --events --triggers --set-gtid-purged=OFF \
            --no-tablespaces --default-character-set=utf8mb4 \
            --databases matrix_prp_upgrade_ci \
            > "$dir/full-synthetic.sql"
          test -s "$dir/full-synthetic.sql"
          digest="$(sha256sum "$dir/full-synthetic.sql" | cut -d' ' -f1)"
          test "${#digest}" = 64
          cp -- "$dir/full-synthetic.sql" "$dir/tampered.sql"
          printf '\n-- synthetic tamper test\n' >> "$dir/tampered.sql"
          test "$(sha256sum "$dir/tampered.sql" | cut -d' ' -f1)" != "$digest"
          rm -f -- "$dir/tampered.sql"
          test "$(sha256sum "$dir/full-synthetic.sql" | cut -d' ' -f1)" = "$digest"
          echo "CI_FULL_V24_SQL_ARCHIVE_TAMPER_REJECTED=YES"
          docker exec -i -e MYSQL_PWD="$rootpw" "$dst" \
            mysql --protocol=TCP -h127.0.0.1 -uroot \
            < "$dir/full-synthetic.sql"
          # Only restored full-schema CLONE runs genuine Flyway V25..V28.
          export PRP_CI_FULL_SCHEMA_PHASE=verify_clone
          ./mvnw -B -ntp -Dtest=IsolatedV24BackupRestoreMcpV28IT test
          echo "CI_FULL_V7_BASELINE_V24_DUMP_RESTORE_V28_CLONE=PASS"
          echo "CI_NO_PRODUCTION_DATA_OR_HOST_ACCESS=YES"
          echo "CI_NO_G0_B2_OR_PRODUCTION_EXPORT_PERMISSION=YES"
