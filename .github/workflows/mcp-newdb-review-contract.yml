name: PRP MCP fresh-MySQL deployment review (no start)

on:
  push:
    branches:
      - test/mcp-authcode-privatejwt-refresh-20261024
    paths:
      - "app/deploy/mcp-staging/compose.newdb.review.yaml"
      - "app/deploy/mcp-staging/check_newdb_review.py"
      - "app/deploy/mcp-staging/test_newdb_review.py"
      - "app/deploy/mcp-staging/host_newdb_readonly_inventory.py"
      - "app/deploy/mcp-staging/test_host_newdb_readonly_inventory.py"
      - "app/deploy/mcp-staging/test_newdb_v2_topology_boundary.py"
      - "app/deploy/mcp-staging/G0-NEWDB-V2-TOPOLOGY-DECISION-20261027.md"
      - "app/deploy/mcp-staging/approval_routes_pending.py"
      - "app/deploy/mcp-staging/ci_smoke_newdb_review.sh"
      - "app/deploy/mcp-staging/check_env.py"
      - "app/deploy/mcp-staging/prepare_env.py"
      - ".github/workflows/mcp-newdb-review-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-fresh-db-shape:
    name: Render fresh-db Compose privately and reject old MySQL/ports
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate Python safety checks (no Compose up)
        run: |
          python3 -m py_compile app/deploy/mcp-staging/check_newdb_review.py app/deploy/mcp-staging/test_newdb_review.py
          python3 -m unittest discover -s app/deploy/mcp-staging -p test_newdb_review.py -v
          python3 -m unittest discover -s app/deploy/mcp-staging -p test_host_newdb_readonly_inventory.py -v
          python3 -m unittest discover -s app/deploy/mcp-staging -p test_newdb_v2_topology_boundary.py -v
      - name: Verify real resolved Compose without writing any host state
        run: python3 app/deploy/mcp-staging/check_newdb_review.py

  real-disposable-newdb:
    name: Launch only disposable fresh-schema Java/Vue/MySQL with MCP OFF
    needs: review-fresh-db-shape
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm isolated runner and shell syntax without deployment
        run: |
          bash -n app/deploy/mcp-staging/ci_smoke_newdb_review.sh
          test "${GITHUB_ACTIONS}" = true
          test -n "${RUNNER_TEMP}"
      - name: Build/start only runner-owned candidate, assert Flyway V28, then destroy only its own volumes
        run: bash app/deploy/mcp-staging/ci_smoke_newdb_review.sh
