name: Deploy PRP
run-name: PRP ${{ github.event_name == 'workflow_run' && 'auto-deploy' || inputs.action }} · ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
on:
  # Only a successful CI run from a push to this repository's main may deploy.
  # Production SSH remains confined to the environment-scoped publish job.
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: Deploy main, check production, or roll back an application release
        type: choice
        options: [promote, deploy, check, rollback, build]
        default: promote
      release_id:
        description: Existing release ID (required for rollback; schema version must match)
        type: string
        default: ''
      candidate_run_id:
        description: Successful PRP release-candidate Actions run ID (required for promote)
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: prp-production
  cancel-in-progress: false
jobs:
  build:
    # workflows triggered by PR CI, fork CI, failed CI or branch CI never build.
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && (inputs.action == 'deploy' || inputs.action == 'build')) ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: matrix_prp
          MYSQL_USER: matrix_prp
          MYSQL_PASSWORD: ci-app-password
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Reject stale or mismatched release candidates
        env:
          EXPECTED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_main="$GITHUB_SHA"
          test "$remote_main" = "$EXPECTED_SHA" || {
            echo "::error::main moved while this release was being prepared; skipping stale candidate"
            exit 1
          }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - name: Validate immutable migrations and text encoding
        run: |
          node app/scripts/verify-db-migrations.mjs
          node app/scripts/check-text-encoding.mjs
      - name: Backend tests and build
        working-directory: app/backend
        run: bash mvnw -B package
      - name: Initialize isolated MySQL for business integration tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client python3-yaml
          /usr/bin/python3 -m unittest discover -s app/deploy -v
          for schema in app/docker/mysql/init/*.sql; do
            MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp < "$schema"
          done
          for schema in $(find app/backend/src/main/resources/db/migration -name 'V*__*.sql' | sort -V); do
            version=$(basename "$schema" | sed -E 's/V([0-9]+)__.*/\1/')
            if [ "$version" -gt 7 ]; then
              MYSQL_PWD=ci-app-password mysql --default-character-set=utf8mb4 -h 127.0.0.1 -u matrix_prp matrix_prp < "$schema"
            fi
          done
      - name: Real MySQL ownership and business integration
        working-directory: app/backend
        env:
          MATRIX_PRP_DB_PASSWORD: ci-app-password
          MATRIX_PRP_BOOTSTRAP_USERNAME: video_admin
          MATRIX_PRP_BOOTSTRAP_PASSWORD: video-test-admin-password-2026
          MATRIX_PRP_JWT_SECRET: ci-integration-only-secret-key-at-least-32-bytes
          MATRIX_PRP_VIDEO_ROOT: ${{ runner.temp }}/prp-video-it
        run: bash mvnw -B -Dtest=VideoDatabaseIT,NotificationDatabaseIT,WellnessDatabaseIT,AiDatabaseIT,AgentTaskDatabaseIT,CodexJobDatabaseIT,FinanceLedgerDatabaseIT test
      - name: Frontend tests, type checking and production build
        working-directory: app/web
        env:
          VITE_APP_BASE: /prp/
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node scripts/verify-deploy-base.mjs /prp/
      - name: Package release
        env:
          RELEASE_ID: r${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 app/deploy/package-release.py "$RELEASE_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prp-release
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Summarize automatic deployment candidate
        if: github.event_name == 'workflow_run'
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          {
            echo '## Verified release candidate — automatic deployment'
            echo ''
            echo "Commit: \`$RELEASE_COMMIT\`"
            echo "Candidate Actions run ID: \`$GITHUB_RUN_ID\`"
            echo ''
            echo 'The production publish job will run automatically after successful CI and build.'
            echo 'If production requires reviewers, GitHub will still hold the job for approval.'
          } >> "$GITHUB_STEP_SUMMARY"
  publish:
    needs: build
    # No PR / fork / failed CI can publish. Environment controls still apply.
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_run' &&
         needs.build.result == 'success' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' &&
         ((inputs.action == 'deploy' && needs.build.result == 'success') ||
          ((inputs.action == 'promote' || inputs.action == 'check' || inputs.action == 'rollback') && needs.build.result == 'skipped')))
      )
    environment:
      name: production
      url: https://micor.top/prp/
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Reject stale main revision
        if: github.event_name == 'workflow_run' || inputs.action == 'deploy' || inputs.action == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$latest" = "$RELEASE_SHA" || {
            echo "::error::Production approval is for a superseded commit; use the latest main."
            exit 1
          }
      - name: Validate approved candidate provenance
        if: inputs.action == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]{1,18}$ ]] || {
            echo "::error::Enter the numeric CI release-candidate Actions run ID."
            exit 2
          }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > "$RUNNER_TEMP/candidate.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" '
            .event == "workflow_run" and .status == "completed" and
            .conclusion == "success" and .head_branch == "main" and
            .head_repository.full_name == $repo and .head_sha == $sha and
            (.path | endswith("/deploy-prp.yml"))
          ' "$RUNNER_TEMP/candidate.json" > /dev/null || {
            echo "::error::Candidate must be a successful Deploy PRP run triggered by main CI at the current commit."
            exit 2
          }
      # Checkout must run BEFORE downloading release.tar.gz: the default clean checkout
      # removes untracked files, including already-verified release archives.
      - name: Checkout controller manifest for the exact release commit
        if: github.event_name == 'workflow_run' || inputs.action == 'deploy' || inputs.action == 'promote'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.event_name == 'workflow_run' || inputs.action == 'deploy'
        with:
          name: prp-release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.action == 'promote'
        with:
          name: prp-release
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Validate artifact matches the tested main commit
        if: github.event_name == 'workflow_run' || inputs.action == 'deploy' || inputs.action == 'promote'
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s release.tar.gz
          artifact_commit="$(tar -xzOf release.tar.gz release.json | jq -er '.commit')"
          [[ "$artifact_commit" == "$RELEASE_SHA" ]] || {
            echo "::error::Release artifact SHA differs from the approved main commit."
            exit 1
          }
      - name: Configure restricted deployment identity
        env:
          SSH_KEY: ${{ secrets.PRP_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRP_DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/prp_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/prp_deploy
          test -s ~/.ssh/known_hosts
      - name: Verify approved production controller before deploying
        if: github.event_name == 'workflow_run' || inputs.action == 'deploy' || inputs.action == 'promote'
        env:
          DEPLOY_HOST: ${{ secrets.PRP_DEPLOY_HOST }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          ssh_args=(-i ~/.ssh/prp_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          ssh "${ssh_args[@]}" "prp-deploy@$DEPLOY_HOST" controller-sha256 > "$RUNNER_TEMP/prp-controller-sha256.txt"
          python3 app/deploy/verify_controller.py --manifest app/deploy/controller-manifest.json --response "$RUNNER_TEMP/prp-controller-sha256.txt"
      - name: Deploy or operate production
        id: production_operation
        env:
          DEPLOY_HOST: ${{ secrets.PRP_DEPLOY_HOST }}
          ACTION: ${{ github.event_name == 'workflow_run' && 'deploy' || inputs.action }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          ssh_args=(-i ~/.ssh/prp_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          # Correlate the root-only diagnostic to this exact publish attempt.
          date -u '+%Y-%m-%dT%H:%M:%SZ' > "$RUNNER_TEMP/prp-publish-start-utc.txt"
          case "$ACTION" in
            deploy|promote)
              # Never invoke the production controller without a local release archive.
              test -s release.tar.gz
              ssh "${ssh_args[@]}" "prp-deploy@$DEPLOY_HOST" deploy < release.tar.gz
              ;;
            check) ssh "${ssh_args[@]}" "prp-deploy@$DEPLOY_HOST" check ;;
            rollback)
              [[ "$RELEASE_ID" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,79}$ ]] || { echo 'Invalid release ID'; exit 2; }
              ssh "${ssh_args[@]}" "prp-deploy@$DEPLOY_HOST" "rollback $RELEASE_ID"
              ;;
            *) exit 2 ;;
          esac
          ssh "${ssh_args[@]}" "prp-deploy@$DEPLOY_HOST" status
      # Failure-only and read-only. This step cannot undo/override a failed
      # deploy, and it never uploads raw SSH stdout or root-only logs.
      - name: Collect sanitized diagnosis on publish failure
        continue-on-error: true
        timeout-minutes: 1
        if: failure() && steps.production_operation.outcome == 'failure' && (github.event_name == 'workflow_run' || inputs.action == 'deploy' || inputs.action == 'promote')
        env:
          DEPLOY_HOST: ${{ secrets.PRP_DEPLOY_HOST }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-i ~/.ssh/prp_deploy -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          diagnosis="$RUNNER_TEMP/prp-remote-diagnosis-untrusted.json"
          status="$RUNNER_TEMP/prp-remote-status-untrusted.json"
          # 'diagnose' must be independently approved and installed.
          # NEVER probe 'status' following a failed deploy: the installed
          # controller may overwrite last-error.log if status itself fails.
          if ! (ulimit -f 16; timeout 20s ssh "${ssh_args[@]}" "prp-deploy@$DEPLOY_HOST" diagnose > "$diagnosis" 2>/dev/null); then
            : > "$diagnosis"
          fi
          : > "$status"
          python3 app/deploy/render_safe_diagnostic.py \
            --diagnostic "$diagnosis" \
            --status "$status" \
            --target-sha "$RELEASE_SHA" \
            --attempt-start "$RUNNER_TEMP/prp-publish-start-utc.txt" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --json-output "$RUNNER_TEMP/prp-safe-diagnostic.json"
      - name: Upload sanitized deployment diagnosis
        continue-on-error: true
        if: failure() && steps.production_operation.outcome == 'failure' && (github.event_name == 'workflow_run' || inputs.action == 'deploy' || inputs.action == 'promote')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prp-safe-deployment-diagnosis
          path: ${{ runner.temp }}/prp-safe-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
      - name: Write deployment summary
        if: success()
        env:
          ACTION: ${{ github.event_name == 'workflow_run' && 'deploy' || inputs.action }}
          RELEASE_ID: ${{ inputs.release_id }}
          COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          printf 'PRP operation: %s\n\nCommit: `%s`\n\nRelease: `%s`\n\n[Open PRP](https://micor.top/prp/)\n' "$ACTION" "$COMMIT" "${RELEASE_ID:-r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" >> "$GITHUB_STEP_SUMMARY"
