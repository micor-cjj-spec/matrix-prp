name: PRP MCP populated V24 to V28 upgrade (disposable CI only)

on:
  push:
    branches:
      - test/mcp-authcode-privatejwt-refresh-20261024
    paths:
      - "app/backend/src/test/java/com/matrix/prp/ExistingPrpV24ToMcpV28UpgradeIT.java"
      - "app/backend/src/main/resources/db/migration/**"
      - "app/backend/pom.xml"
      - ".github/workflows/mcp-populated-v24-upgrade-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  populated-upgrade:
    name: Existing synthetic PRP data, real MySQL Flyway V24 to V28
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: app/backend/pom.xml
      - name: Verify every old migration is byte-identical to current main
        shell: bash
        run: |
          set -Eeuo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          count=0
          while IFS= read -r path; do
            name="${path##*/}"
            [[ "$name" =~ ^V([0-9]+)__.*\.sql$ ]] || continue
            version="${BASH_REMATCH[1]}"
            if (( version <= 24 )); then
              test "$(git rev-parse "origin/main:$path")" = "$(git rev-parse "HEAD:$path")" || {
                echo 'CI_UPGRADE_ORIGINAL_MIGRATION_BLOB_DIFFERS_FROM_MAIN' >&2
                exit 1
              }
              count=$((count+1))
            fi
          done < <(git ls-tree -r --name-only origin/main -- app/backend/src/main/resources/db/migration/)
          test "$count" -eq 24
          echo 'CI_ORIGINAL_MAIN_MIGRATIONS_V1_THROUGH_V24_IDENTICAL=YES'
      - name: Start only a brand-new loopback MySQL owned by this runner
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != true ||
                "${RUNNER_OS:-}" != Linux ||
                ! "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            echo 'CI_DISPOSABLE_RUNNER_ONLY' >&2
            exit 2
          fi
          umask 077
          container="prp-mcp-v24-upgrade-${GITHUB_RUN_ID}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          export MATRIX_PRP_DB_PASSWORD="$(openssl rand -hex 24)"
          export MATRIX_PRP_DB_USER="prp_upgrade_ci"
          export PRP_CI_DISPOSABLE_UPGRADE_ONLY="YES"
          export MATRIX_PRP_DB_URL="jdbc:mysql://127.0.0.1:13308/matrix_prp_upgrade_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai"
          rootpass="$(openssl rand -hex 24)"
          docker run -d --rm --name "$container" -p 127.0.0.1:13308:3306 \
            -e MYSQL_ROOT_PASSWORD="$rootpass" \
            -e MYSQL_DATABASE=matrix_prp_upgrade_ci \
            -e MYSQL_USER="$MATRIX_PRP_DB_USER" \
            -e MYSQL_PASSWORD="$MATRIX_PRP_DB_PASSWORD" \
            mysql:8.4 >/dev/null

          ok=0
          for i in $(seq 1 60); do
            if docker exec -e MYSQL_PWD="$MATRIX_PRP_DB_PASSWORD" "$container" \
              mysql --protocol=TCP -h 127.0.0.1 -u "$MATRIX_PRP_DB_USER" \
              -D matrix_prp_upgrade_ci -Nse 'SELECT 1' >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" -eq 1 || {
            echo 'CI_POPULATED_UPGRADE_MYSQL_NOT_READY' >&2
            exit 1
          }

          cd app/backend
          chmod +x mvnw
          ./mvnw -B -ntp -Dtest=ExistingPrpV24ToMcpV28UpgradeIT test
          echo 'CI_DISPOSABLE_UPGRADE_NO_HOST_SERVICE_OR_REAL_DATA_MUTATION=YES'
