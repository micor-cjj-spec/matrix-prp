name: MCP exact-scope no-network regression (temporary review)
on:
  push:
    branches: [fix/mcp-public-preflight-exact-scopes-20261025]
permissions:
  contents: read
jobs:
  scope-preflight-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Exercise strict public scope and OAuth discovery regressions without network
        working-directory: app/deploy/mcp-oauth
        run: |
          python3 -m unittest -v test_public_route_preflight.py test_public_readonly_probe.py
