name: MCP isolated stage scope review (temporary)
on:
  push:
    branches: [fix/mcp-stage-task-scope-lock-20261025]
permissions:
  contents: read
jobs:
  task-only-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Isolated staging configuration and lab wiring regressions
        working-directory: app/deploy/mcp-staging
        run: python3 -m unittest -v test_staging_config test_oauth_lab_contract
      - name: Strict public metadata negative regressions (no network)
        working-directory: app/deploy/mcp-oauth
        run: python3 -m unittest -v test_public_readonly_probe
      - name: Verify private server E2E syntax (do not execute against a server)
        run: python3 -m py_compile app/deploy/mcp-oauth-stage/server_e2e.py
